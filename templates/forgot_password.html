{% extends 'base.html' %}
{% block content %}
<div class="card card-center">
  <h3>Forgot Password</h3>
  <form method="POST">
    <div class="form-group">
      <label>Username or Email</label>
      <input type="text" name="username_or_email" class="form-control" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    </div>
    <button type="submit" class="btn btn-primary">Send Reset Link</button>
  </form>
</div>
{% endblock %}
