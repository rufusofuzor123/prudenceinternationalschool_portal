{% extends 'base.html' %}
{% block content %}
<div class="card card-center">
  <h3>System Sign In</h3>
  <form method="POST">
    <div class="form-group">
      <label>Username / Student ID</label>
      <input type="text" name="username" class="form-control" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" class="form-control" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    </div>
    <button type="submit" class="btn btn-primary">Login</button>
    <p style="margin-top:10px;"><a href="{{ url_for('forgot_password') }}">Forgot Password?</a></p>
  </form>
</div>
{% endblock %}
