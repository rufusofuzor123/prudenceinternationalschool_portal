{% extends 'base.html' %}
{% block content %}
<h2>Principal's Comments</h2>

<div class="card no-print">
    <form method="POST">
        {% for student in students %}
        <div class="form-group">
            <label>{{ student.full_name }} ({{ student.assigned_class or 'N/A' }})</label>
            <textarea name="pcomment_{{ student.id }}" class="form-control" rows="2">{{ existing_comments.get(student.id, '') }}</textarea>
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Save Comments</button>
    </form>
</div>
{% endblock %}
