{% extends 'base.html' %}
{% block content %}
<h2>My Payment Receipts</h2>

<div class="table-wrapper">
    <table class="data-table">
        <thead><tr><th>Date</th><th>Reference</th><th>Amount</th><th></th></tr></thead>
        <tbody>
            {% for p in payments %}
            <tr>
                <td>{{ p.date_paid.strftime('%d %b %Y') }}</td>
                <td>{{ p.reference }}</td>
                <td>₦{{ "{:,.2f}".format(p.amount) }}</td>
                <td><a href="{{ url_for('view_receipt', payment_id=p.id) }}" class="btn btn-primary btn-sm">View / Print Receipt</a></td>
            </tr>
            {% else %}
            <tr><td colspan="4">No payments recorded yet.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
